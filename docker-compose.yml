# Optional local services. Not used in production (use managed MySQL + S3-compatible storage).
#   docker compose up -d mysql            # database only
#   docker compose --profile storage up -d  # + MinIO (S3-compatible)
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_USER: brandai
      MYSQL_PASSWORD: brandai_local_pw
      MYSQL_DATABASE: brandai_dev
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_only"]
      interval: 5s
      retries: 20

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_pw
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  mysql-data:
  minio-data:
